[package]
name = "void"
version = "0.2.0"
edition = "2021"
description = "A quiet, Tor-first browser with ephemeral sessions and fingerprint resistance"
license = "MIT"
repository = "https://github.com/Ivoryy06/void"
readme = "README.md"
keywords = ["browser", "privacy", "tor", "gtk", "webkit"]
categories = ["web-programming"]

[dependencies]
gtk = "0.18"
glib = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dirs = "5"
urlencoding = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
